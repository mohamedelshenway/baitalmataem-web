name: Keep Supabase project active

# The Supabase Free Plan pauses a project after about 7 days with no activity.
# This workflow makes a tiny, read-only request to the database twice a week
# so the project is never seen as inactive. It costs nothing and changes no
# data — see the RLS policies on `listings` for what it's allowed to read.

on:
  schedule:
    - cron: "0 6 * * 1,4" # every Monday and Thursday at 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://cyegaaxqbpccqwidqjmw.supabase.co
          # Add this as a repo secret: Settings -> Secrets and variables -> Actions
          # -> New repository secret -> name it SUPABASE_ANON_KEY. It's the same
          # public "anon" key already used in the site's client-side code
          # (NEXT_PUBLIC_SUPABASE_ANON_KEY on Vercel), just kept out of the repo
          # as good practice.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS -o /dev/null -w "Supabase ping response: HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/listings?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
