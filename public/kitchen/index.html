<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="/kitchen/manifest.json">
<link rel="apple-touch-icon" href="/kitchen/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المطبخ">
<title>المطبخ – بيت المطاعم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f2; --card:#ffffff; --ink:#17201a; --muted:#66706a; --line:#dfe4de;
  --brand:#14532d; --brand2:#1f7a45; --soft:#e7f1ea;
  --ok:#1f7a45; --warn:#b26b00; --bad:#b3261e; --warnbg:#fff4e0; --badbg:#fdecea;
  --f:"IBM Plex Sans Arabic", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:620px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom));min-height:100%}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
header.top h1{font-size:18px;margin:0;flex:1;font-weight:700}
header.top .sub{font-size:13px;color:var(--muted);font-weight:500}
.back{border:0;background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--muted)}
.tile.main{background:var(--brand);color:#fff;border-color:var(--brand)}
.tile.main span{color:#cfe7d6}
.tile .ic{font-size:22px;line-height:1}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px;font-weight:500}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:17px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:0;border-color:transparent}
.row{display:flex;gap:8px;align-items:end}
.row>*{flex:1}
.btn{border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700;background:var(--brand);color:#fff;width:100%;margin-top:12px}
.btn.sec{background:var(--soft);color:var(--brand)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5}
.btn.sm{width:auto;padding:9px 12px;font-size:14px;margin:0;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;color:var(--brand)}
.seg button.on{background:var(--brand);color:#fff}
.list{display:flex;flex-direction:column}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;text-align:start;background:var(--card,#fff);border:1px solid var(--line);border-radius:18px;padding:16px 14px;font:inherit;color:inherit;cursor:pointer}
.step .no{width:30px;height:30px;border-radius:50%;background:var(--pri,#1f5e3a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 30px}
.step .ic{font-size:30px}.step b{display:block;font-size:18px}.step small{color:var(--muted);font-size:13px}
.hint{background:#f1f6f2;border-radius:12px;padding:8px 10px;font-size:13px;margin-top:8px}
.li{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600}
.li .t small{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.pill{font-size:12px;border-radius:999px;padding:3px 9px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--soft);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-bad{background:var(--badbg);color:var(--bad)}
.alert{border-radius:14px;padding:12px;margin-bottom:12px;background:var(--warnbg);color:#6b4100;font-size:14px}
.alert.bad{background:var(--badbg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted)}
.big{font-size:30px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.x{border:0;background:var(--badbg);color:var(--bad);border-radius:10px;width:36px;height:36px;font-size:18px}
table.pl{width:100%;border-collapse:collapse;font-size:15px}
table.pl td{padding:8px 2px;border-bottom:1px solid var(--line)}
table.pl td:last-child{text-align:left}
table.pl tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:88%;border-radius:20px 20px 0 0;padding:14px;overflow:auto}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90%;font-size:15px}
.toast.bad{background:var(--bad)}
#scanbox{width:100%;border-radius:12px;overflow:hidden;margin-top:10px}
.pin{letter-spacing:8px;text-align:center;font-size:24px}
.shiftbar{display:flex;gap:8px;align-items:center}
@media print{.noprint,.back,#rg,.chips{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#ccc}}
@media (prefers-reduced-motion:no-preference){.tile:active,.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
// ---------- i18n ----------
const I18N=(()=>{
  const LANGS={ar:{n:'العربية',dir:'rtl',loc:'ar-EG'},ru:{n:'Русский',dir:'ltr',loc:'ru-RU'},bn:{n:'বাংলা',dir:'ltr',loc:'bn-BD'},ur:{n:'اردو',dir:'rtl',loc:'ur-PK'},en:{n:'English',dir:'ltr',loc:'en-GB'}};
  let L='ar',D=null,MAXW=1,obs=null;
  try{const u=new URL(location.href),q=u.searchParams.get('l');if(q){if(LANGS[q])localStorage.setItem('lc_lang',q);u.searchParams.delete('l');history.replaceState(null,'',u.pathname+u.search+u.hash)}L=localStorage.getItem('lc_lang')||'ar';if(!LANGS[L])L='ar'}catch(e){}
  const RUN=/[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]+(?:[ \t ،؛؟!?.:\-–—/()«»"+]*[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]+)*[؟?!.:]?/g;
  function trRun(m){
    const lead=m.match(/^\s*/)[0],trail=m.match(/\s*$/)[0],k=m.replace(/\s+/g,' ').trim();
    if(D[k]!==undefined)return lead+D[k]+trail;
    const w=k.split(' '),out=[];let i=0;
    while(i<w.length){let hit=0;for(let j=Math.min(w.length,i+MAXW);j>i;j--){const s=w.slice(i,j).join(' ');if(D[s]!==undefined&&!(j-i===1&&WEAK.has(s))){out.push(D[s]);i=j;hit=1;break}}
      if(!hit){out.push(w[i]);i++}}
    return lead+out.join(' ')+trail}
  const WEAK=new Set(['من','في','و','يا','لـ','للـ','م','ر','أو','إلى','لحد','على','عندك','لسه','مفيش','رجع','خلص','جديد','نص','قطعة','صورة']);
  const tr=s=>(!D||!s)?s:s.replace(RUN,trRun);
  const SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1};const DONE=new WeakMap();
  function node(n){
    if(n.nodeType===3){const p=n.parentNode;if(!p||SKIP[p.nodeName]||p.closest&&p.closest('[data-notr]'))return;
      const o=n.data;if(DONE.get(n)===o)return;const t=tr(o);if(t===o)return;
      if(p.nodeType===1&&(p.childNodes.length===1||!p.hasAttribute('data-ar')))p.setAttribute('data-ar',p.textContent);
      if(p.nodeName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',p.getAttribute('data-ar'));
      DONE.set(n,t);n.data=t;return}
    if(n.nodeType!==1||SKIP[n.nodeName]||n.hasAttribute('data-notr'))return;
    for(const a of ['placeholder','title','aria-label'])if(n.hasAttribute(a)){const o=n.getAttribute(a),t=tr(o);if(t!==o)n.setAttribute(a,t)}
    if(n.nodeName==='INPUT'&&/^(button|submit)$/.test(n.type)){const t=tr(n.value);if(t!==n.value)n.value=t}
    for(const c of [...n.childNodes])node(c)}
  function start(){
    document.documentElement.lang=L;document.documentElement.dir=LANGS[L].dir;
    if(LANGS[L].dir==='ltr'){const st=document.createElement('style');st.textContent='header .back,.back{transform:scaleX(-1)} .seg[data-notr] button{font-family:inherit}';document.head.appendChild(st)}
    node(document.body);document.title=tr(document.title);
    obs=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else{for(const a of m.addedNodes)node(a);if(m.type==='attributes')node(m.target)}}});
    obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title']});
    for(const f of ['alert','confirm','prompt']){const o=window[f].bind(window);window[f]=(m,...r)=>o(tr(String(m??'')),...r)}
    document.body.style.visibility=''}
  async function init(){
    if(L==='ar')return;
    document.documentElement.dir=LANGS[L].dir;document.body&&(document.body.style.visibility='hidden');
    const t=setTimeout(()=>{document.body.style.visibility=''},4000);
    try{D=await (await fetch('i18n/'+L+'.json?v=1')).json();for(const k in D)MAXW=Math.max(MAXW,k.split(' ').length)}catch(e){D=null}
    clearTimeout(t);if(D)start();else document.body.style.visibility=''}
  function set(l,reload=true){if(!LANGS[l])return;try{localStorage.setItem('lc_lang',l)}catch(e){};if(l!==L&&reload){let n=0;try{n=+sessionStorage.getItem('lc_lang_rl')||0;sessionStorage.setItem('lc_lang_rl',n+1)}catch(e){};if(n<2)location.reload()}}
  return {get lang(){return L},get loc(){return LANGS[L].loc},LANGS,init,set,tr};
})();
const TX=el=>(el&&el.getAttribute&&el.getAttribute('data-ar'))??(el?el.textContent:undefined);
const SB='https://fstbbuattdhoszklobio.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzdGJidWF0dGRob3N6a2xvYmlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3MzM5NTYsImV4cCI6MjExMDMwOTk1Nn0.olJT0fYgtUPGSCtLKSeBCUheqe99-wm4PE50EOtcUzs';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0=v=>v==null||v===''?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:0});
const n2=v=>v==null||v===''?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:2});
const pc=v=>v==null?'—':(v*100).toFixed(1)+'%';
const tm=s=>new Date(s).toLocaleTimeString(I18N.loc,{hour:'numeric',minute:'2-digit'});
const S={token:null,b:null,lines:[],att:null};
try{S.token=localStorage.getItem('lc_token')}catch(e){}

async function rpc(fn,args={}){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&j.message)||'حصلت مشكلة، حاول تاني'; if(/انتهت الجلسة/.test(m)){logout(true)} throw new Error(m)}
  return j;
}
const T=(fn,a={})=>rpc(fn,{p_token:S.token,...a});
function toast(m,bad){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),bad?4500:2600)}
async function act(btn,fn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message,true)}finally{if(btn)btn.disabled=false}}
function logout(silent){S.att=null;S.b=null;S.rules=null;if(S.token&&!silent)rpc('lc_logout',{p_token:S.token}).catch(()=>{});S.token=null;try{localStorage.removeItem('lc_token')}catch(e){};location.hash='';login()}
const isMgr=()=>S.b&&['manager','owner'].includes(S.b.me.role);
const item=code=>S.b.items.find(i=>i.code===code);
function head(title,sub,back=true){return `<header class="top">${back?`<button class="back" onclick="goBack()" aria-label="رجوع">→</button>`:''}<div style="flex:1"><h1>${esc(title)}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div></header>`}
function go(h){const c=location.hash.slice(1);if(c!==h){(S.stack=S.stack||[]).push(c);S.tabBack=null}location.hash=h}
function goBack(){if(S.tabBack){const f=S.tabBack;S.tabBack=null;return f()}
  const c=location.hash.slice(1),parent={hrp:'hr',supd:'sup'}[c];S.stack=S.stack||[];
  let p=S.stack.pop();while(p===c&&S.stack.length)p=S.stack.pop();
  if(parent!==undefined&&(p===undefined||p===''))p=parent;location.hash=p||''}
window.addEventListener('hashchange',route);

function LANGBAR(){return `<div class="seg" data-notr style="margin-top:14px">${Object.entries(I18N.LANGS).map(([k,v])=>`<button class="${I18N.lang===k?'on':''}" onclick="setLang('${k}')">${v.n}</button>`).join('')}</div>`}
async function setLang(l){try{if(S.token)await T('lc_set_lang',{p_lang:l})}catch(e){};I18N.set(l)}
// ---------- login ----------
async function pinReset(tk){
  const app=$('#app');
  app.innerHTML=`<div style="padding-top:8vh">${head('رقم سري جديد','بيت المطاعم · نظام المطبخ',false)}<div class="card" id="rs"><div class="muted">جاري التحميل…</div></div></div>`;
  let info;try{info=await rpc('lc_pin_reset_info',{p_reset:tk})}catch(e){$('#rs').innerHTML=`<div class="alert">${esc(e.message)}</div><button class="btn" onclick="location.href=location.pathname">الدخول</button>`;return}
  $('#rs').innerHTML=`<p>الحساب: <b>${esc(info.name)}</b></p><label for="p1">الرقم السري الجديد (4 لـ 8 أرقام)</label><input id="p1" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"><label for="p2">اكتبه تاني للتأكيد</label><input id="p2" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"><button class="btn" id="go">حفظ الرقم السري</button><p class="muted">اللينك ده بيشتغل مرة واحدة بس.</p>`;
  $('#go').onclick=()=>act($('#go'),async()=>{if($('#p1').value!==$('#p2').value)throw new Error('الرقمين مش زي بعض');await rpc('lc_pin_reset',{p_reset:tk,p_new:$('#p1').value});toast('الرقم السري اتغير ✓');setTimeout(()=>{location.href=location.pathname+'?u='+encodeURIComponent(info.name)},900)});
}
async function login(){
  const rsT=new URLSearchParams(location.search).get('reset');if(rsT&&/^[0-9a-f-]{36}$/i.test(rsT))return pinReset(rsT);
  const app=$('#app');
  app.innerHTML=`<div style="padding-top:8vh">${head('دخول','بيت المطاعم · نظام المطبخ',false)}<div class="card"><label for="nm">الاسم</label><select id="nm"><option value="">جاري التحميل…</option></select>
  <label for="pin">الرقم السري</label><input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
  <button class="btn" id="lg">دخول</button></div>${LANGBAR()}</div>`;
  try{const ns=await rpc('lc_staff_names');$('#nm').innerHTML='<option value="">اختار اسمك</option>'+ns.map(x=>`<option>${esc(x.name)}</option>`).join('');
    const u=new URLSearchParams(location.search).get('u');if(u&&ns.some(x=>x.name===u)){$('#nm').value=u;$('#pin').focus()}}catch(e){toast(e.message,true)}
  const doit=()=>act($('#lg'),async()=>{const r=await rpc('lc_login',{p_name:$('#nm').value,p_pin:$('#pin').value});S.token=r.token;try{localStorage.setItem('lc_token',r.token)}catch(e){};await boot();go('');route()});
  $('#lg').onclick=doit;$('#pin').onkeydown=e=>{if(e.key==='Enter')doit()};
}
async function boot(){S.b=await T('lc_bootstrap');const ml=S.b&&S.b.me&&S.b.me.lang;if(ml&&ml!==I18N.lang){I18N.set(ml);throw new Error('…')}}

// ---------- router ----------
async function route(){
  if(!S.token)return login();
  if(!S.b){try{await boot()}catch(e){return}}
  const h=location.hash.slice(1); S.lines=[];
  if(!S.b.me.profile_done){if(h!=='')go('');return profileScreen()}
  if(!S.b.me.supplier&&!isOwner()){if(S.rules==null){S.rules=await T('lc_policy_status').catch(()=>({penalties_v1:true}))}if(!S.rules.penalties_v1){if(h!=='')go('');return rulesScreen()}}
  if(S.b.me.supplier){(({'':supplierHome,supinv:supInvoice,mystmt:myStatement,fb:feedback})[h]||supplierHome)();return}
  const noAtt=isOwner()&&S.b.me.job==='Owner';
  if(!noAtt&&S.att==null){S.att=await T('lc_my_attendance').catch(()=>[])}
  const last=noAtt?{kind:'دخول'}:S.att[S.att.length-1];
  if(!last||last.kind!=='دخول'){if(h!=='')go('');return checkScreen('دخول')}
  if(!canGo(h)){go('');return}
  const map={'':home,issue,receive,waste,yieldv:yieldScreen,prep:make,count,req:requests,items:itemsMgr,menu:menuMgr,stock,sales,cash,report,admin,log:audit,att:attendance,invs:invoices,stats:analytics,subs,fb:feedback,mynote:myNote,voice:voiceInbox,po:poList,sup:suppliersMgr,supd:supplierDetail,hr:hrList,hrp:hrPage,sopen:shiftOpen,sclose:shiftClose,route:routeScreen,clean:cleanScreen,mynotes:myNotesScreen,viol:violScreen,myviol:myViolScreen};
  (map[h]||home)();
  if((h===''||!map[h])&&!isOwner())T('lc_my_violations_new').then(n=>{const el=document.getElementById('myViolA');if(el&&n>0)el.innerHTML=`<div class="alert bad" onclick="go('myviol')"><b>عليك ${n} مخالفة جديدة</b><br>اضغط تشوف التفاصيل والجزاء ←</div>`}).catch(()=>{});
  if((h===''||!map[h])&&(isOwner()||S.b.me.role==='manager'))T('lc_policy_report').then(R=>{const n=R.filter(x=>!x.accepted_at);const el=document.getElementById('rulesAck');if(el&&R.length)el.innerHTML=n.length?`<div class="alert"><b>جدول المخالفات: ${R.length-n.length} من ${R.length} وافقوا</b><br>لسه ماوافقوش: ${n.map(x=>esc(x.name)).join(' · ')}</div>`:`<div class="alert" style="background:#e5f4e4"><b>جدول المخالفات: كل الموظفين وافقوا ✓</b></div>`}).catch(()=>{});
  window.scrollTo(0,0);
}

// ---------- rules (penalties) ----------

><td class=\"\">خصم 3 أيام</td><td class=\"\">خصم 5 أيام + إنذار نهائي</td></tr><tr class=\"\"><td class=\"\">سوء معاملة عميل أو زميل</td><td class=\"\">خصم 1 يوم</td><td class=\"\">خصم 3 أيام</td><td class=\"\">خصم 5 أيام + إنذار نهائي</td><td class=\"\">فصل حسب النظام</td></tr><tr class=\"\"><td class=\"\">الغياب من غير إذن (يتخصم يوم الغياب كمان)</td><td class=\"\">خصم 1 يوم</td><td class=\"\">خصم 3 أيام</td><td class=\"\">خصم 5 أيام + إنذار نهائي</td><td class=\"\">فصل حسب النظام</td></tr></tbody></table></div><h2>5. القواعد اللي بيمشي عليها الجدول</h2><ul><li>«اليوم» = المرتب الشهري ÷ 30.</li><li>المخالفة بتتحسب مرة تانية لو اتكررت خلال 6 شهور من المرة اللي قبلها، وبعد 6 شهور من غير تكرار يرجع العداد من الأول.</li><li>أي مخالفة تتسجل في سيستم الفرع، ومعاها صورة أو شكوى العميل، والموظف بيشوفها على حسابه في السيستم.</li><li>مخالفات النظافة بتتراجع يوميًا من صور جدول النظافة على السيستم.</li><li>الموظف بيتبلغ بالجزاء كتابة، وليه حق يتظلم كتابة خلال 30 يوم.</li><li>حسب نظام العمل: مافيش أكتر من جزاء واحد على المخالفة الواحدة، والغرامة ماتزيدش عن أجر 5 أيام للمخالفة، وماتزيدش عن أجر 5 أيام في الشهر.</li><li>الفصل بيتم في الحالات المقررة في نظام العمل، بعد الإنذارات الكتابية.</li><li>الجدول ده يتراجع مع المحاسب أو مكتب العمل، ويتضاف للائحة تنظيم العمل في المنشأة.</li></ul>";

// ---------- violations ----------
async function violScreen(tab){
  tab=tab||'add';S.tabBack=tab!=='add'?()=>violScreen():null;
  $('#app').innerHTML=`${head('المخالفات','حسب جدول المخالفات والجزاءات')}<div class="chips" style="margin-bottom:12px">${[['add','تسجيل مخالفة'],['log','السجل']].map(([k,l])=>`<button class="chip${k===tab?' on':''}" onclick="violScreen('${k}')">${l}</button>`).join('')}</div><div id="vb"><div class="muted">جاري التحميل…</div></div>`;
  if(tab==='log'){
    const L=await T('lc_violations',{p_days:60}).catch(e=>{toast(e.message,true);return null});if(!L)return;
    const tot={};L.filter(v=>!v.cancelled).forEach(v=>{tot[v.name]=(tot[v.name]||0)+ +v.amount});
    $('#vb').innerHTML=`${Object.keys(tot).length?`<div class="card"><h2>الخصومات (آخر 60 يوم)</h2><div class="list">${Object.entries(tot).map(([n,a])=>`<div class="li"><div class="t"><b>${esc(n)}</b></div><b class="num">${n0(a)} ريال</b></div>`).join('')}</div></div>`:''}
    <div class="card"><div class="list">${L.map(v=>`<div class="li" style="${v.cancelled?'opacity:.45;text-decoration:line-through':''}"><div class="t"><b>${esc(v.name)} · ${esc(v.title)}</b><small>${v.day} · المرة رقم ${v.n} · <b>${esc(v.penalty)}</b>${+v.amount?` · ${n0(v.amount)} ريال`:''}${v.note?' · '+esc(v.note):''} · سجّلها ${esc(v.by||'—')} · ${v.seen?'الموظف شافها ✓':'لسه ماشافهاش'}</small></div>${v.cancelled?'':`<button class="x" onclick="violCancel(${v.id})">✕</button>`}</div>`).join('')||'<div class="muted">مفيش مخالفات</div>'}</div></div>`;
    return;
  }
  const D=await T('lc_violation_types').catch(e=>{toast(e.message,true);return null});if(!D)return;
  const secs=[...new Set(D.types.map(t=>t.section))];
  $('#vb').innerHTML=`<div class="card"><label for="vs">الموظف</label><select id="vs"><option value="">اختار الموظف</option>${D.staff.map(x=>`<option value="${x.id}">${esc(x.name)}${x.job?' · '+esc(x.job):''}</option>`).join('')}</select>
    <label for="vc">المخالفة</label><select id="vc"><option value="">اختار المخالفة</option>${secs.map(sc=>`<optgroup label="${esc(sc)}">${D.types.filter(t=>t.section===sc).map(t=>`<option value="${t.code}">${esc(t.title)}</option>`).join('')}</optgroup>`).join('')}</select>
    <label for="vn">التفاصيل (إيه اللي حصل، رقم الطلب، شكوى العميل)</label><input id="vn" placeholder="مثلًا: طلب كيتا 1234 من غير منديل">
    <button class="btn" id="va">تسجيل المخالفة</button>
    <p class="muted">السيستم بيحسب لوحده دي المرة الكام خلال 6 شهور، والجزاء حسب الجدول، والخصم بالريال (المرتب ÷ 30)، ومش بيعدّي أجر 5 أيام في الشهر. والموظف هيشوفها على حسابه.</p></div><div id="vr"></div>`;
  $('#va').onclick=()=>act($('#va'),async()=>{const st=$('#vs').value,cd=$('#vc').value;if(!st)throw new Error('اختار الموظف');if(!cd)throw new Error('اختار المخالفة');
    const r=await T('lc_violation_add',{p_staff:st,p_code:cd,p_note:$('#vn').value||null});
    $('#vr').innerHTML=`<div class="alert ${r.days>0?'bad':''}"><b>اتسجلت ✓ المرة رقم ${r.occurrence}: ${esc(r.penalty)}</b>${+r.amount?`<br>الخصم: ${n0(r.amount)} ريال (${r.days} يوم)`:''}${r.warn?`<br>${esc(r.warn)}`:''}<br>بلّغ الموظف كتابة، وهو هيشوفها على السيستم.</div>`;$('#vn').value='';toast('المخالفة اتسجلت ✓')});
}

const KITCHEN=[['receive','📦','استلام','فاتورة المورد'],['prep','🍲','تحضير','صوص أو تتبيلة'],['issue','🥩','المستخدم اليومي','اللي اشتغلت بيه'],['waste','🗑️','هدر','بالكمية والسبب'],['count','📋','جرد','آخر الوردية'],['req','🛒','نواقص','اطلب اللي ناقص'],['yieldv','⚖️','اختبار فاقد','أوزان قبل وبعد']];
const CASHIER=[['shift','💵','فتح وتقفيل الوردية','الدرج والمبيعات']];
const MGMT=[['subs','🥗','الاشتراكات','تسليم اليوم والتجديد'],['viol','⚠️','المخالفات','تسجيل ومتابعة الجزاءات'],['sales','💰','مبيعات الوردية','آخر اليوم'],['stock','🏬','المخزون','عندي كام وناقص إيه'],['cash','🧾','الخزنة','كاش ومورّدين'],['invs','📑','الفواتير المستلمة','بصور الفاتورة والميزان'],['report','📊','تقرير آخر اليوم','الربح وفين العجز'],['menu','🍽️','المنيو ومبيعات الأصناف','ملف فودكس وتكلفة الطبق'],['items','🧾','الأصناف والريسبي','الأسعار والفاقد'],['stats','📈','التحليلات','أرقام ورسوم'],['att','📸','الحضور','صور الدخول والانصراف'],['log','🕓','السجل','كل حركة باسم صاحبها'],['po','🛒','أوامر الشراء','بتتعمل لوحدها قبل ما الحاجة تخلص'],['sup','🚚','الموردين','الفواتير والمطابقة والحسابات'],['admin','⚙️','الإعدادات','فروع ومواعيد ومصاريف']];
const SUPPLY=[['supply','📸','بوابة المورد','يرفع فواتيره ويشوف حسابه']];
const isOwner=()=>S.b&&S.b.me.role==='owner';
function myPerms(){const me=S.b.me;if(me.role==='owner')return null;if(me.role==='manager'&&me.perms==null)return MGMT.concat(KITCHEN,CASHIER).map(x=>x[0]);return me.perms||[]}
const has=k=>{const P=myPerms();return P===null||P.includes(k)};
function canGo(h){if(h===''||h==='fb'||h==='mynote'||h==='myviol')return true;if(h==='viol')return isOwner()||S.b.me.role==='manager';if(h==='supd')return has('sup');if(h==='hr'||h==='hrp'||h==='voice')return isOwner();if(h==='sopen'||h==='sclose')return has('shift');if(h==='route')return has('route')||has('subs');if(h==='clean')return has('clean');if(h==='mynotes')return isOwner();return has(h)}

  const stepTxt={receive:'البضاعة اللي جت من المورد + صورة الفاتورة والميزان أو الكراتين',prep:'عملت صوص أو تتبيلة؟ اختار الريسبي واكتب الوزن اللي طلع',issue:'اللي اشتغلت بيه النهارده من الخامات والتحضيرات'};
  const drv=myPerms()!==null&&has('route');const nothing=!k.length&&!mg.length&&!has('shift')&&!isOwner()&&!drv&&!has('clean');
  $('#app').innerHTML=`${head(`${hi} يا ${/^Mr\./.test(b.me.name)?b.me.name:b.me.name.split(' ')[0]}`,esc(b.branch.name)+(b.me.job?' · '+esc(b.me.job):''),false)}

const NZ=t=>String(t||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'').replace(/\bال/g,'').replace(/\s+/g,' ').trim();
function pickItem(onPick,filter,allowNew){

  document.body.appendChild(m);
  const all=S.b.items.filter(filter||(()=>true));
  const draw=q=>{q=(q||'').trim();const w=NZ(q).split(' ').filter(Boolean);const r=all.filter(i=>!q||w.every(x=>NZ(i.name).includes(x))||i.code.toLowerCase()===q.toLowerCase()||i.barcode===q).slice(0,60);
    m.querySelector('#res').innerHTML=r.map(i=>`<div class="li" data-c="${esc(i.code)}"><div class="t"><b>${esc(i.name)}</b><small>${esc(i.code)} · ${esc(i.unit)}${i.qty!=null?` · عندك <span class="num">${n2(i.qty)}</span>`:''}</small></div></div>`).join('')+
      (allowNew&&q.length>1&&!all.some(i=>NZ(i.name)===NZ(q))?`<div class="li" data-new="1" style="background:#eef7f1"><div class="t"><b>+ ضيف «${esc(q)}» كصنف جديد</b><small>لو الصنف مش موجود في القائمة</small></div></div>`:'')||'<div class="muted">مفيش نتيجة، اكتب اسم الصنف</div>'};
  draw('');const q=m.querySelector('#q');q.oninput=()=>draw(q.value);
  q.onkeydown=e=>{if(e.key==='Enter'){const i=all.find(x=>x.barcode&&x.barcode===q.value.trim());if(i){close();onPick(i)}}};
  let scanner=null;const close=()=>{if(scanner){scanner.stop().catch(()=>{})}m.remove()};
  m.querySelector('#cl').onclick=close;
  m.querySelector('#res').onclick=e=>{const li=e.target.closest('.li');if(!li)return;
    if(li.dataset.new){const nm=q.value.trim();const u=document.createElement('div');u.className='modal';
      u.innerHTML=`<div class="sheet"><h2 style="margin:0 0 6px">صنف جديد: ${esc(nm)}</h2><label>الوحدة</label><div class="seg" id="uu">${['كجم','لتر','قطعة','علبة','كرتونة','ربطة'].map((x,k)=>`<button data-u="${x}" class="${k?'':'on'}">${x}</button>`).join('')}</div><button class="btn" id="ok">إضافة</button><button class="btn sec" id="no">رجوع</button></div>`;
      document.body.appendChild(u);let un='كجم';u.querySelector('#uu').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;un=b.dataset.u;u.querySelectorAll('#uu button').forEach(x=>x.classList.toggle('on',x===b))};
      u.querySelector('#no').onclick=()=>u.remove();
      u.querySelector('#ok').onclick=()=>act(u.querySelector('#ok'),async()=>{const r=await T('lc_item_quick',{p_name:nm,p_unit:un});
        let it=item(r.code);if(!it){it={code:r.code,name:r.name,unit:r.unit,kind:'raw',qty:0};S.b.items.push(it)}u.remove();close();onPick(it)});return}
    close();onPick(item(li.dataset.c))};
  m.querySelector('#sc').onclick=()=>scan(m.querySelector('#scanbox'),code=>{const i=all.find(x=>x.barcode===code);if(i){close();onPick(i)}else{q.value=code;draw('');toast('الباركود ده مش متسجل على خامة. المدير يسجله من الإعدادات',true)}},s=>scanner=s);
  setTimeout(()=>q.focus(),50);

function scan(box,onCode,keep){

const fq=(q,u)=>(u==='كجم'||u==='لتر')&&q>0&&q<1?`<span class="num">${n0(q*1000)}</span> ${u==='كجم'?'جم':'مل'}`:`<span class="num">${n2(q)}</span> ${esc(u)}`;

function yieldHint(i,q){if(!q||!(i.cy||i.ky))return '';const u=i.unit;

function nativePick(facing){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture',facing==='user'?'user':'environment');
  i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=u};i.click()})}
function galleryPick(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=u};i.click()})}
function snapCam(title,label,facing,hi){S.hiImg=null;return new Promise(async res=>{
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet" style="text-align:center"><h2 style="margin:0 0 8px;font-size:17px">${esc(title)}</h2><video playsinline autoplay muted style="width:100%;max-height:58vh;border-radius:14px;background:#000"></video><canvas style="display:none"></canvas>
  <button class="btn" id="cs" disabled>📸 صوّر</button>${/^(فاتورة|استلام|تحديث ملف)/.test(label)?'<button class="btn sec" id="cg">🖼️ ارفع صورة من الجهاز</button>':''}<button class="btn sec" id="cx">إلغاء</button></div>`;
  document.body.appendChild(m);const v=m.querySelector('video'),c=m.querySelector('canvas');let st=null;
  const end=r=>{st&&st.getTracks().forEach(t=>t.stop());m.remove();res(r)};
  m.querySelector('#cx').onclick=()=>end(null);
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing||'environment'},width:{ideal:1280}},audio:false});v.srcObject=st;m.querySelector('#cs').disabled=false}catch(e){v.style.display='none';m.querySelector('#cs').textContent='📷 افتح الكاميرا';m.querySelector('#cs').disabled=false;st=null}
  const shoot=async(gal)=>{
    let src=v,sw=v.videoWidth,sh=v.videoHeight;if(gal||!st){src=await (gal?galleryPick():nativePick(facing));if(!src)return;sw=src.naturalWidth;sh=src.naturalHeight}
    const w=960,h=Math.round(w*(sh||720)/(sw||960));c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(src,0,0,w,h);
    if(hi){const hc=document.createElement('canvas'),hw=Math.min(1800,sw||1600),hh=Math.round(hw*(sh||720)/(sw||960));hc.width=hw;hc.height=hh;hc.getContext('2d').drawImage(src,0,0,hw,hh);S.hiImg=hc.toDataURL('image/jpeg',0.8)}
    const now=await rpc('lc_now').catch(()=>null);const ts=now?now.riyadh.slice(0,16):new Date().toLocaleString('en-GB');
    x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,h-66,w,66);x.fillStyle='#fff';x.direction='rtl';x.textAlign='right';
    x.font='600 22px "IBM Plex Sans Arabic", sans-serif';x.fillText(label,w-14,h-38);
    x.font='500 18px "IBM Plex Sans Arabic", sans-serif';x.fillText(`${S.b.me.name} · ${S.b.branch.name} · ${ts}`,w-14,h-12);
    let img=c.toDataURL('image/jpeg',0.6);if(img.length>560000)img=c.toDataURL('image/jpeg',0.4);
    end(img)};
  m.querySelector('#cs').onclick=()=>act(m.querySelector('#cs'),()=>shoot(false));
  const cg=m.querySelector('#cg');if(cg)cg.onclick=()=>act(cg,()=>shoot(true));
})}
const thumb=(src,sz=56)=>`<img src="${src}" alt="" style="width:${sz}px;height:${sz}px;object-fit:cover;border-radius:10px;flex:0 0 auto" onclick="event.stopPropagation();bigImg(this.src)">`;

function linesUI(withPrice){
  const rows=S.lines.map((l,k)=>{const i=item(l.code);const cost=withPrice?l.qty*l.price:l.qty*(i.cost||0);

function recvList(){return S.lines.map((l,k)=>{const i=item(l.code);return `<div class="li" onclick="recvEdit(${k})" style="cursor:pointer"><div class="t"><b>${esc(i.name)}</b><small>${l.cartons?`<span class="num">${n2(l.cartons)}</span> كرتونة × <span class="num">${n2(l.pack)}</span> = `:''}<span class="num">${n2(l.qty)}</span> ${esc(i.unit)}</small></div><button class="x" onclick="event.stopPropagation();S.lines.splice(${k},1);$('#lines').innerHTML=recvList()">✕</button></div>`}).join('')||'<div class="muted">لسه مضفتش أصناف</div>'}

  <div id="wbox"><label for="lq">الكمية (${esc(i.unit)})</label><input id="lq" type="number" inputmode="decimal" step="any" value="${l&&!l.cartons?l.qty:''}"></div>
  <div id="cbox" style="display:none"><div class="row"><div><label for="cn">عدد الكراتين</label><input id="cn" type="number" inputmode="decimal" step="any" value="${l&&l.cartons||''}"></div>
  <div><label for="cp">الكرتونة فيها كام ${esc(i.unit)}</label><input id="cp" type="number" inputmode="decimal" step="any" value="${pk}"></div></div><div id="cc" class="muted" style="margin-top:6px"></div></div>
  <button class="btn" id="ok">تمام</button><button class="btn sec" id="no">إلغاء</button></div>`;
  document.body.appendChild(m);const q=x=>m.querySelector(x);let mode=l&&l.cartons?'c':'w';
  const sw=()=>{q('#cbox').style.display=mode==='c'?'':'none';q('#wbox').style.display=mode==='c'?'none':''};sw();
  q('#mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;q('#mode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));sw()};
  const cc=()=>{const a=+q('#cn').value,b=+q('#cp').value;q('#cc').innerHTML=a>0&&b>0?`هيتسجل: <b class="num">${n2(a*b)}</b> ${esc(i.unit)}`:''};q('#cn').oninput=cc;q('#cp').oninput=cc;cc();
  q('#no').onclick=()=>m.remove();
  q('#ok').onclick=()=>{let r;if(mode==='c'){const a=+q('#cn').value,b=+q('#cp').value;if(!(a>0))return toast('اكتب عدد الكراتين',true);if(!(b>0))return toast('اكتب الكرتونة فيها كام '+i.unit,true);r={code:i.code,qty:+(a*b).toFixed(3),cartons:a,pack:b};(S.packs=S.packs||{})[i.code]=b}
    else{const v=+q('#lq').value;if(!(v>0))return toast('اكتب الكمية',true);r={code:i.code,qty:v}}m.remove();done(r)};
  setTimeout(()=>(mode==='c'?q('#cn'):q('#lq')).focus(),50)}
function recvAdd(){pickItem(i=>recvQty(i,null,r=>{S.lines.push(r);$('#lines').innerHTML=recvList()}),x=>x.kind!=='prep',true)}
function recvEdit(k){const l=S.lines[k];recvQty(item(l.code),l,r=>{S.lines[k]=r;$('#lines').innerHTML=recvList()})}
function recvReview(rows,extra,onOk){const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h2 style="margin:0 0 6px">راجع قبل الحفظ</h2>

  ${extra.length?`<div class="alert" style="background:#fff6e5"><b>أصناف على الفاتورة انت ماسجلتش إنك استلمتها:</b><ul style="margin:6px 0 0">${extra.map(x=>`<li>${esc(x.text||'')}${x.qty?` — ${n2(x.qty)} ${esc(x.unit||'')}`:''}</li>`).join('')}</ul></div>`:''}
  <p class="muted">اتأكد من البضاعة مع المندوب. لو الكلام ده صح، احفظ والإدارة هتشوف الفرق.</p>

  $('#invcam').onclick=async()=>{const img=await snapCam('صوّر الفاتورة كاملة وهي ممضية، قريب وواضحة','فاتورة استلام',null,true);if(img){invPhoto=img;invHi=S.hiImg||img;$('#invph').innerHTML=thumb(img,64);$('#invcam').textContent='📷 إعادة التصوير'}};
  $('#gcam').onclick=async()=>{const img=await snapCam('صوّر البضاعة أو الكراتين كلها','استلام · بضاعة');if(img){goods=img;$('#gph').innerHTML=thumb(img,64);$('#gcam').textContent='📷 إعادة التصوير'}};
  $('#pay').onclick=e=>{const b=e.target.closest('button');if(!b)return;pay=b.dataset.p;$('#pay').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#sv').onclick=()=>act($('#sv'),async()=>{
    if(!invPhoto)throw new Error('صوّر الفاتورة الأول');if(!pay)throw new Error('اختار آجل ولا دفعت كاش');if(!S.lines.length)throw new Error('ضيف الأصناف اللي استلمتها');if(!goods)throw new Error('صوّر البضاعة أو الكراتين');
    $('#ai').innerHTML='<div class="alert">⏳ بقرا الفاتورة… ثواني</div>';
    let d={};try{const r=await fetch('/api/invoice-read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:S.token,image:invHi,suppliers:sup,mine:S.lines.map(l=>({name:item(l.code).name,qty:l.qty,unit:item(l.code).unit}))})});
      const j=await r.json();if(!j.ok)throw new Error(j.error);d=j.data||{}}catch(e){d={_err:e.message||'ماقدرتش أقرا الفاتورة'}}

      const r=await T('lc_receive_v2',{p_supplier:s,p_invoice:invNo,p_pay:pay,p_lines:lines,p_invoice_photo:invPhoto,p_note:nt});

function editRecipe(r){

  m.querySelector('#r_l').oninput=e=>{const k=e.target.dataset.k;if(k!=null){L[k].qty=+e.target.value;tot()}};
  m.querySelector('#r_l').onclick=e=>{const k=e.target.dataset.x;if(k!=null){L.splice(+k,1);drawL()}};
  m.querySelector('#r_o').oninput=tot;m.querySelector('#r_u').onchange=tot;
  m.querySelector('#r_a').onclick=()=>{m.style.display='none';pickItem(i=>{m.style.display='';if(L.some(l=>l.code===i.code))return toast('المكون موجود بالفعل',true);

    const D=await T('lc_dish_report',{p_from:f,p_to:t}).catch(()=>null);if(D&&D.rows.length){const sq=D.rows.reduce((a,r)=>a+ +r.qty,0),ss=D.rows.reduce((a,r)=>a+ +(r.sales||0),0);

function drawReport(x,e,lab){
  const fcp=x.food_cost_pct, gaps=[];
  if(!x.sales_days)gaps.push(['bad','مبيعات الفترة مش متسجلة، فالربح مش هيطلع صح. سجّل مبيعات كل وردية.']);
  if(x.fct!=null&&fcp!=null&&fcp>x.fct)gaps.push(['bad',`تكلفة الخامات ${pc(fcp)} من المبيعات، والمستهدف ${pc(x.fct)}. الزيادة ≈ ${n0((fcp-x.fct)*x.net)} ريال`]);
  if(x.count_loss>0)gaps.push(['bad',`عجز في الجرد بقيمة ${n0(x.count_loss)} ريال: خامات ناقصة من غير ما تتسجل صرف أو هدر`]);
  if(x.cash_diff<0)gaps.push(['bad',`عجز في الخزنة ${n0(-x.cash_diff)} ريال`]);
  if(x.waste>0)gaps.push(['warn',`هدر بقيمة ${n0(x.waste)} ريال`]);
  if(x.result<0&&x.sales_days)gaps.push(['bad',`المبيعات أقل من التكاليف بـ ${n0(-x.result)} ريال. محتاج مبيعات زيادة حوالي ${n0(-x.result*(1+S.b.branch.vat))} ريال شامل الضريبة عشان تتعادل`]);
  if(x.fct==null)gaps.push(['warn','حدد نسبة تكلفة الخامات المستهدفة من الإعدادات عشان أقارنها']);
  if(!x.comm_set&&(x.sales.keeta||x.sales.ninja||x.sales.hunger))gaps.push(['warn','عمولات التطبيقات مش متسجلة في الإعدادات، فالربح طالع أعلى من الحقيقي']);
  const line=(l,v,c)=>`<tr${c?` class="${c}"`:''}><td>${l}</td><td class="num">${n0(v)}</td></tr>`;

   <div class="kpi"><div class="v num">${X.active}</div><div class="l">مشترك نشط دلوقتي</div></div>
   <div class="kpi"><div class="v num">${n0(X.liability)}</div><div class="l">فلوس مدفوعة لوجبات لسه ما اتسلمتش</div></div>
   <div class="kpi"><div class="v num">${X.new} / ${X.renewals}</div><div class="l">جديد / تجديد</div></div>
   <div class="kpi"><div class="v num" style="color:${X.ended_no_renew?'var(--bad)':'inherit'}">${X.ended_no_renew}</div><div class="l">خلصوا وما جددوش</div></div></div>
  <div class="card" style="margin-top:12px"><h2>يوم بيوم</h2>${svg}</div>
  <div class="card"><h2>حسب الباقة</h2>${bars(X.by_package.map(p=>({l:p.package_name,v:+p.paid,sub:`${p.n} اشتراك${+p.list>+p.paid?` · خصم ${n0(p.list-p.paid)}`:''}`})))}${disc?`<p class="muted">متوسط الخصم ${pc(disc)} من سعر الباقات</p>`:''}</div>
  <div class="card"><h2>طريقة الدفع</h2>${bars(X.by_pay.map(p=>({l:p.pay,v:+p.paid,sub:`${p.n} اشتراك`})))}</div>`;
}

// ---------- analytics ----------
function bars(rows,opt={}){ // rows: [{l,v,sub}]
  if(!rows.length)return '<div class="muted">مفيش بيانات في الفترة دي</div>';
  const mx=Math.max(...rows.map(r=>Math.abs(r.v)))||1;
  return rows.map(r=>`<div style="margin:8px 0"><div class="row" style="align-items:center;gap:6px"><span style="flex:1;font-size:14px">${esc(r.l)}${r.sub?` <span class="muted">${esc(r.sub)}</span>`:''}</span><b class="num" style="flex:0 0 auto;font-size:14px">${opt.fmt?opt.fmt(r.v):n0(r.v)}</b></div>
  <div style="height:9px;background:var(--soft);border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.max(2,Math.abs(r.v)/mx*100)}%;background:${opt.color||'var(--brand2)'};border-radius:6px"></div></div></div>`).join('');
}
function dailyChart(D){
  if(!D.some(d=>d.sales||d.materials||d.purchases))return '<div class="muted">مفيش بيانات في الفترة دي</div>';
  const W=560,H=190,pad=26,n=D.length,bw=(W-pad*2)/n,mx=Math.max(...D.map(d=>Math.max(d.sales,d.materials+d.waste+d.count_loss)))||1,y=v=>H-pad-(v/mx)*(H-pad*2);
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4,yy=y(v);g+=`<line x1="${pad}" x2="${W-pad}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${W-pad+2}" y="${yy+4}" font-size="10" fill="var(--muted)">${n0(v)}</text>`}
  const b=D.map((d,k)=>{const x=pad+k*bw;const c=d.materials+d.waste+d.count_loss;return `<rect x="${x+bw*.12}" y="${y(d.sales)}" width="${bw*.38}" height="${H-pad-y(d.sales)}" fill="var(--brand2)" rx="2"><title>${d.day} مبيعات ${n0(d.sales)}</title></rect><rect x="${x+bw*.5}" y="${y(c)}" width="${bw*.38}" height="${H-pad-y(c)}" fill="#e0a43a" rx="2"><title>${d.day} خامات وهدر ${n0(c)}</title></rect>${n<=16||k%Math.ceil(n/10)===0?`<text x="${x+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${d.day.slice(8)}</text>`:''}`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr">${g}${b}</svg><div class="muted"><span style="color:var(--brand2)">■</span> المبيعات &nbsp; <span style="color:#e0a43a">■</span> الخامات + الهدر + عجز الجرد</div>`;
}
async function analytics(){
  const d=x=>{const t=new Date();t.setDate(t.getDate()-x);return t.toISOString().slice(0,10)};
  const P=[['آخر 7 أيام',d(6)],['آخر 30 يوم',d(29)],['الشهر ده',new Date().toISOString().slice(0,8)+'01'],['آخر 90 يوم',d(89)]];
  $('#app').innerHTML=`${head('التحليلات','كل الأرقام في مكان واحد')}<div class="chips" id="pp" style="margin-bottom:12px">${P.map((p,k)=>`<button class="chip${k===1?' on':''}" data-k="${k}">${p[0]}</button>`).join('')}</div><div id="an"><div class="muted">جاري الحساب…</div></div>`;
  const load=async k=>{$('#an').innerHTML='<div class="muted">جاري الحساب…</div>';const [A,X]=await Promise.all([T('lc_analytics',{p_from:P[k][1],p_to:d(0)}),T('lc_sub_stats',{p_from:P[k][1],p_to:d(0)})].map(p=>p.catch(e=>{toast(e.message,true);return null})));if(A)drawAn(A);if(X)$('#an').insertAdjacentHTML('beforeend',`<h2 style="font-size:16px;margin:18px 2px 10px">الاشتراكات</h2>${subStatsHTML(X,P[k][0])}`)};
  $('#pp').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('#pp').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));load(+b.dataset.k)};
  load(1);
}
function drawAn(A){
  const D=A.daily,sum=k=>D.reduce((a,x)=>a+ +x[k],0);
  const sales=sum('sales'),mat=sum('materials'),waste=sum('waste'),cl=sum('count_loss'),pur=sum('purchases');
  const net=sales/(1+S.b.branch.vat);const fc=net?(mat+waste+cl)/net:null;
  const days=D.filter(x=>x.sales>0).length;
  const card=(t,body)=>`<div class="card"><h2>${t}</h2>${body}</div>`;
  const ch=Object.entries(A.sales_by_channel||{}).filter(([,v])=>v>0).map(([l,v])=>({l,v:+v,sub:sales?pc(v/sales):''})).sort((a,b)=>b.v-a.v);
  const att=A.attendance.map(a=>`<div class="li"><div class="t"><b>${esc(a.name)}</b><small>${a.days} يوم${a.hours!=null?` · ${a.hours} ساعة`:''}${a.avg_in_morning?` · متوسط دخول الصباحي ${a.avg_in_morning}`:''}${a.avg_in_evening?` · المسائي ${a.avg_in_evening}`:''}</small></div>${a.late?`<span class="pill p-warn">تأخير ${a.late}</span>`:''}${a.outside?`<span class="pill p-bad">بره الفرع ${a.outside}</span>`:''}</div>`).join('');
  $('#an').innerHTML=`<div class="kpis">
   <div class="kpi"><div class="v num">${n0(sales)}</div><div class="l">المبيعات · متوسط اليوم ${days?n0(sales/days):'—'}</div></div>
   <div class="kpi"><div class="v" style="color:${S.b.branch.fct!=null&&fc>S.b.branch.fct?'var(--bad)':'inherit'}">${pc(fc)}</div><div class="l">تكلفة الخامات من المبيعات${S.b.branch.fct!=null?` · المستهدف ${pc(S.b.branch.fct)}`:''}</div></div>
   <div class="kpi"><div class="v num">${n0(mat)}</div><div class="l">خامات اتصرفت</div></div>
   <div class="kpi"><div class="v num" style="color:${waste+cl>0?'var(--bad)':'inherit'}">${n0(waste+cl)}</div><div class="l">هدر ${n0(waste)} + عجز جرد ${n0(cl)}</div></div>
   <div class="kpi"><div class="v num">${n0(pur)}</div><div class="l">مشتريات</div></div>
   <div class="kpi"><div class="v num">${A.requests.total||0}</div><div class="l">طلبات نواقص · مفتوح ${A.requests.open||0}${A.requests.avg_hours!=null?` · الرد في ${A.requests.avg_hours} ساعة`:''}</div></div></div>
  ${card('المبيعات والتكلفة يوم بيوم',dailyChart(D))}
  ${card('المبيعات حسب القناة',bars(ch))}
  ${A.sales_by_shift.length?card('المبيعات حسب الوردية',bars(A.sales_by_shift.map(s=>({l:s.shift,v:+s.total,sub:`${s.n} وردية · متوسط ${n0(s.total/s.n)}`})))):''}
  ${card('أكتر الخامات استهلاكًا (بالريال)',bars(A.top_items.map(i=>({l:i.name,v:+i.value,sub:`${n2(i.qty)} ${i.unit}`}))))}
  ${card('الصرف حسب الشيف',bars(A.issue_by_staff.map(i=>({l:i.name,v:+i.value,sub:`${i.n} مرة`}))))}
  ${card('الهدر حسب السبب',bars(A.waste_by_reason.map(i=>({l:i.reason,v:+i.value,sub:`${i.n} مرة`})),{color:'var(--bad)'}))}
  ${card('الهدر حسب الشيف',bars(A.waste_by_staff.map(i=>({l:i.name,v:+i.value,sub:`${i.n} مرة`})),{color:'var(--bad)'}))}
  ${card('عجز الجرد حسب الخامة',bars(A.count_by_item.map(i=>({l:i.name,v:+i.value,sub:`ناقص ${n2(-i.qty)} ${i.unit}`})),{color:'var(--bad)'}))}
  ${card('عجز الجرد حسب اللي جرد والوردية',bars(A.count_by_staff.map(i=>({l:`${i.name} · ${i.shift}`,v:+i.value})),{color:'var(--bad)'}))}
  ${card('المشتريات حسب المورد',bars(A.purchases_by_supplier.map(i=>({l:i.supplier,v:+i.total,sub:`${i.n} فاتورة${i.credit?` · آجل ${n0(i.credit)}`:''}`}))))}
  ${A.price_changes.length?card('تغيّر أسعار الشراء',`<table class="pl">${A.price_changes.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${n2(p.min_p)} ← ${n2(p.max_p)}${p.ref?` (المرجعي ${n2(p.ref)})`:''}</td></tr>`).join('')}</table>`):''}
  ${A.yields.length?card('الفاقد والتسوية مقابل المعيار',`<table class="pl">${A.yields.map(y=>`<tr><td>${esc(y.name)} · ${y.n} وزنة</td><td>${y.clean?`تنظيف ${pc(y.clean)}`:''}${y.cooked?` · تسوية ${pc(y.cooked)} (أقل ${pc(y.cooked_min)})`:''}${y.std_cook?` · المعيار ${pc(y.std_cook)}`:''}</td></tr>`).join('')}</table>`):''}
  ${A.cash_counts.length?card('جرد الخزنة',bars(A.cash_counts.map(k=>({l:`${k.day} · ${k.shift} · ${k.name||''}`,v:+k.diff})),{color:'var(--bad)',fmt:v=>n2(v)})):''}
  ${A.expenses.length?card('المصاريف النثرية',bars(A.expenses.map(e=>({l:e.party,v:+e.amount,sub:`${e.n} مرة`})))):''}
  ${card('الحضور',(att||'<div class="muted">مفيش تسجيل حضور</div>')+(A.shift_times.morning||A.shift_times.evening?'':'<p class="muted">حدد مواعيد الورديات من الإعدادات عشان يتحسب التأخير.</p>'))}`;
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/kitchen/sw.js',{scope:'/kitchen/'}).catch(()=>{});
I18N.init().then(()=>route());
</script>
